# main 브랜치에 push 하면: 단위 테스트·빌드 확인 → (통과 시) 빌드 → GitHub Pages 배포
# 테스트가 하나라도 실패하면 배포하지 않는다 (사이트는 이전 버전 유지)
# 브라우저 테스트(15~20분)는 사용자가 요청할 때만 (2026-11-26 사용자 결정) — Actions 에서 'Run workflow' 에 e2e 를 켜고 실행
name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: '브라우저 테스트도 돌리기 (15~20분)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 단위 테스트
        run: npm test
      - name: 빌드 확인
        run: npm run build

  # 브라우저 테스트 — 요청할 때만 (workflow_dispatch 의 e2e 를 켬)
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저 테스트
        run: npm run test:e2e
      - name: 테스트 화면 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screens
          path: test-results/
          retention-days: 7

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
