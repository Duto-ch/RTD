<title>등급 재배분 캐릭터 그림</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 등급이 바뀐 31명 카드 — 카드마다 예전 / 새 등급 그림을 나란히 재생 (대기 → 공격 반복) */
:root { --bg: #e9e2cf; --card: #fbf7ec; --ink: #3a2e22; --sub: #7d6e5a; --line: #d9cdb2; --sage: #7a9a5c; --field: #6d8f4e; --up: #3e8a50; --down: #b0562a;
  --display: 'Sunflower', 'Gowun Dodum', sans-serif; --body: 'Gowun Dodum', 'Sunflower', sans-serif; color-scheme: light }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1f1b16; --card: #2c2620; --ink: #f1e8d6; --sub: #b8a98f; --line: #4a4033; --up: #7cc48a; --down: #e08a62; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1f1b16; --card: #2c2620; --ink: #f1e8d6; --sub: #b8a98f; --line: #4a4033; --up: #7cc48a; --down: #e08a62; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.55 }
.wrap { max-width: 1200px; margin: 0 auto; padding-block: 28px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px }
h1 { font-family: var(--display); font-size: 1.9rem; margin: 0 }
h2 { font-family: var(--display); font-size: 1.2rem; margin: 8px 0 0 }
.lead { color: var(--sub); max-width: 74ch; margin: 0 }
.rules { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none }
.rules li { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .84rem }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.card h3 { font-family: var(--display); margin: 0; font-size: 1rem; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap }
.card h3 small { font-family: var(--body); font-weight: 400 }
.up { color: var(--up) } .down { color: var(--down) }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px }
figcaption { font-size: .75rem; color: var(--sub) }
canvas { width: 100%; max-width: 168px; aspect-ratio: 56 / 40; image-rendering: pixelated; background: var(--field); border-radius: 8px }
.note { font-size: .8rem; color: var(--sub); margin: 0 }
</style>
<div class="wrap">
  <h1>등급 재배분 — 캐릭터 그림 다시 뽑기</h1>
  <p class="lead">등급이 바뀐 31명입니다. 왼쪽이 예전 등급 그림, 오른쪽이 새 등급으로 다시 그린 그림이에요(대기 → 공격 반복, 발밑 고리는 새 등급색). 등급이 그림에 주는 차이:</p>
  <ul class="rules">
    <li>몸 색 수 커먼 10 · 언커먼 12 · 레어 14 · 유니크 15</li>
    <li>가슴 장식: 언커먼+ 은 단추 · 레어+ 금 장식</li>
    <li>유니크: 금빛 강조색 · 망토 · 대기 중 반짝임</li>
    <li>무기 재질·장식 (레어+ 지팡이 띠, 유니크 활 끝 말림 등)</li>
    <li>시안 출신 6명은 사용자 그림 그대로 — 고리 색만 바뀜</li>
  </ul>
  <h2 id="hUp"></h2>
  <div class="grid" id="gUp"></div>
  <h2 id="hDown"></h2>
  <div class="grid" id="gDown"></div>
</div>
<script>
const D = __DATA__;
const GR = { 1: '커먼', 2: '언커먼', 3: '레어', 4: '유니크' };
const RING = { 1: ['#3e220c', '#8a5426'], 2: ['#3c4656', '#f0f4fa'], 3: ['#3e1670', '#b36cff'], 4: ['#7a4a00', '#ffd23a'] };
const Z = 3;
const players = [];
function add(c, el) {
  const card = document.createElement('section');
  card.className = 'card';
  const dir = c.grade > c.old ? 'up' : 'down';
  card.innerHTML = `<h3>${c.name} <small class="${dir}">${GR[c.old]} → ${GR[c.grade]} ${dir === 'up' ? '▲' : '▼'}</small></h3>
    <div class="pair"><figure><canvas></canvas><figcaption>예전 (${GR[c.old]})</figcaption></figure><figure><canvas></canvas><figcaption>${c.original ? '그림 그대로 · 고리만' : '새 그림'} (${GR[c.grade]})</figcaption></figure></div>`;
  el.appendChild(card);
  const [a, b] = card.querySelectorAll('canvas');
  for (const [cv, src, g] of [[a, c.oldSrc, c.old], [b, c.newSrc, c.grade]]) {
    cv.width = D.W * Z; cv.height = D.H * Z;
    const img = new Image(); img.src = src;
    const ms = [...c.idle, ...c.idle, ...c.attack];
    const idx = [...c.idle.keys(), ...c.idle.keys(), ...c.attack.map((_, i) => c.idle.length + i)];
    players.push({ cv, img, ms, idx, total: ms.reduce((s, x) => s + x, 0), g });
  }
}
const up = D.chars.filter((c) => c.grade > c.old), down = D.chars.filter((c) => c.grade < c.old).sort((x, y) => y.old - x.old);
document.getElementById('hUp').textContent = `등급이 오른 캐릭터 ${up.length}명`;
document.getElementById('hDown').textContent = `등급이 내린 캐릭터 ${down.length}명`;
up.forEach((c) => add(c, document.getElementById('gUp')));
down.forEach((c) => add(c, document.getElementById('gDown')));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now) {
  for (const p of players) {
    if (!p.img.complete) continue;
    let t = reduce ? 0 : now % p.total, k = 0;
    while (t >= p.ms[k]) { t -= p.ms[k]; k++; }
    const g = p.cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, p.cv.width, p.cv.height);
    // 발밑 등급 고리 (몸 중심 27,23 아래)
    const [o, f] = RING[p.g];
    g.fillStyle = o; g.beginPath(); g.ellipse(27 * Z, 31 * Z, 9 * Z, 3.2 * Z, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = f; g.beginPath(); g.ellipse(27 * Z, 31 * Z, 7.5 * Z, 2.2 * Z, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = o; g.beginPath(); g.ellipse(27 * Z, 31 * Z, 5.5 * Z, 1.4 * Z, 0, 0, Math.PI * 2); g.fill();
    g.drawImage(p.img, p.idx[k] * D.W, 0, D.W, D.H, 0, 0, D.W * Z, D.H * Z);
  }
  if (!reduce) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
