<title>스킬 이펙트 공용 세트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&display=swap">
<style>
:root{--bg:#f3eedf;--card:#fbf7ec;--ink:#4a3a28;--sub:#7d6c57;--line:#e2d8c0;--sage:#7a9a5c;--sage-ink:#fff;--font:"Sunflower","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b16;--card:#2a251e;--ink:#efe6d2;--sub:#b3a68e;--line:#3d362b;--sage:#8fb06f;--sage-ink:#16130f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1b16;--card:#2a251e;--ink:#efe6d2;--sub:#b3a68e;--line:#3d362b;--sage:#8fb06f;--sage-ink:#16130f;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
h1{font-size:26px;margin:0;text-wrap:balance}
.lead{color:var(--sub);margin:4px 0 0;line-height:1.55}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:sticky;top:8px;z-index:2}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.grp>span{color:var(--sub);font-size:13px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
button[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink);border-color:var(--sage)}
button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px;min-width:0}
.card h2{margin:0;font-size:16px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.card h2 small{font-size:12px;color:var(--sub);font-weight:500}
.card p{margin:0;color:var(--sub);font-size:12.5px;line-height:1.45}
canvas{image-rendering:pixelated;display:block;border-radius:8px;width:100%;height:auto}
</style>
<div class="wrap">
  <header><h1>스킬 이펙트 공용 세트 · 커먼 / 언커먼</h1>
  <p class="lead">커먼끼리, 언커먼끼리 함께 쓰는 이펙트입니다(두 세트는 서로 공유하지 않음). 탑뷰 · 셀 카툰(선·점·입자 2도트 이상) · 16비트 · 색 외곽선, 커먼 4색 이하 / 언커먼 5색 이하. 바닥에 깔리는 고리·칸 테두리는 캐릭터 뒤, 화살표·별·동전은 앞에 그립니다. 같은 그림을 속성색만 바꿔 씁니다. 배경 칸은 실제 필드 한 칸(24도트 = 화면 48px)입니다.</p></header>
  <div class="bar">
    <div class="grp" id="tier"><span>등급</span><button data-v="1" aria-pressed="true">커먼 (11종)</button><button data-v="2">언커먼 (13종)</button><button data-v="0">나란히 비교</button></div>
    <div class="grp" id="attr"><span>속성</span><button data-v="red" aria-pressed="true">레드</button><button data-v="blue">블루</button><button data-v="green">그린</button></div>
    <div class="grp" id="zoom"><span>크기</span><button data-v="3" aria-pressed="true">크게</button><button data-v="2">게임 크기 (2px)</button></div>
    <button id="play" aria-pressed="true">⏸ 일시정지</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const D = __DATA__;
const st = { tier: 1, attr: 'red', zoom: 3, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches };
const imgs = {}; for (const e of D.fx) { const i = new Image(); i.src = e.src; let b = null; if (e.backSrc) { b = new Image(); b.src = e.backSrc; } imgs[e.tier + e.key + e.attr] = { e, i, b }; }
const ch = new Image(); ch.src = D.char;
const SW = 120, SH = 96, BX = 60, BY = 56;
const WITH_CHAR = new Set(['buff_self', 'buff_adj', 'buff_all', 'gold']);
let cards = [];
function build() {
  const g = document.getElementById('grid'); g.innerHTML = ''; cards = [];
  const keys = [...new Set(D.fx.filter((e) => st.tier === 0 || e.tier === st.tier).map((e) => e.key))];
  for (const key of keys) {
    const tiers = st.tier === 0 ? [1, 2].filter((t) => imgs[t + key + 'red']) : [st.tier];
    for (const t of tiers) {
      const el = document.createElement('section'); el.className = 'card';
      el.innerHTML = `<h2>${imgs[t + key + 'red'].e.name} <small>${t === 1 ? '커먼' : '언커먼'}</small></h2><p>${D.desc[key] || ''}</p><canvas></canvas>`;
      g.appendChild(el);
      cards.push({ key, t, cv: el.querySelector('canvas'), pos: 0, tm: -Math.random() * 400, gap: 0, cf: 0, ct: 0 });
    }
  }
}
function tiles(g, z) {
  const T = 24, ox = ((BX - 12) % T) - T, oy = ((BY - 12) % T) - T;
  for (let ty = 0; oy + ty * T < SH; ty++) for (let tx = 0; ox + tx * T < SW; tx++) {
    const x = (ox + tx * T) * z, y = (oy + ty * T) * z;
    g.fillStyle = (tx + ty) % 2 ? '#696e7a' : '#adafb7'; g.fillRect(x, y, T * z, T * z);
    g.fillStyle = '#454953'; g.fillRect(x, y, T * z, z); g.fillRect(x, y, z, T * z);
  }
}
function draw(c) {
  const z = st.zoom, cv = c.cv; if (cv.width !== SW * z) { cv.width = SW * z; cv.height = SH * z; cv.style.width = z === 2 ? SW * 2 + 'px' : '100%'; cv.style.margin = z === 2 ? '0 auto' : '0'; }
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; tiles(g, z);
  const { e, i, b } = imgs[c.t + c.key + st.attr];
  // 바닥 레이어(캐릭터 뒤) → 캐릭터 → 앞 레이어 순서로 그린다
  const sheet = (im, x, y, sx = 1) => { if (im && c.gap <= 0 && im.complete) g.drawImage(im, c.pos * e.w, 0, e.w, e.h, (x - e.ax) * z, (y - e.ay) * z, e.w * z * sx, e.h * z); };
  const fx = (x, y, sx = 1) => sheet(i, x, y, sx);
  const fxBack = (x, y) => sheet(b, x, y);
  const hero = (x, y) => ch.complete && g.drawImage(ch, c.cf * 56, 0, 56, 40, (x - 27) * z, (y - 23) * z, 56 * z, 40 * z);
  if (c.key === 'buff_all') { for (const x of [24, 60, 96]) { fxBack(x, BY + 2); hero(x, BY - 4); fx(x, BY + 2); } return; }
  if (c.key === 'hit') { for (const [x, y] of [[40, 40], [78, 50], [56, 72]]) fx(x, y); return; }
  if (c.key === 'chain') { fx(18, 46, 84 / 68); return; }
  if (c.key === 'stun' || c.key === 'vuln') { fx(BX, BY + 8); return; }
  if (WITH_CHAR.has(c.key)) { const y = c.key === 'buff_adj' ? BY : BY + 6; fxBack(BX, y); hero(BX, BY); fx(BX, y); return; }
  fx(BX, BY);
}
let last = performance.now();
(function loop(now) {
  const dt = now - last; last = now;
  for (const c of cards) {
    if (st.playing) {
      const e = imgs[c.t + c.key + st.attr].e;
      c.ct += dt; while (c.ct > 150) { c.ct -= 150; c.cf = (c.cf + 1) % 8; }
      if (c.gap > 0) c.gap -= dt;
      else { c.tm += dt; while (c.tm >= e.ms[c.pos]) { c.tm -= e.ms[c.pos]; c.pos++; if (c.pos >= e.n) { c.pos = 0; c.gap = 600; break; } } }
    }
    draw(c);
  }
  requestAnimationFrame(loop);
})(performance.now());
function group(id, key, num) { const g = document.getElementById(id); g.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); st[key] = num ? Number(b.dataset.v) : b.dataset.v; if (key === 'tier') build(); }); }
group('tier', 'tier', true); group('attr', 'attr', false); group('zoom', 'zoom', true);
const pb = document.getElementById('play'); const setP = (v) => { st.playing = v; pb.setAttribute('aria-pressed', v); pb.textContent = v ? '⏸ 일시정지' : '▶ 재생'; };
setP(st.playing); pb.onclick = () => setP(!st.playing);
build();
</script>
