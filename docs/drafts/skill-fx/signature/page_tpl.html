<title>레어·유니크 전용 스킬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sunflower:wght@500;700&display=swap">
<style>
:root{--bg:#f3eedf;--card:#fbf7ec;--ink:#4a3a28;--sub:#7d6c57;--line:#e2d8c0;--sage:#7a9a5c;--sage-ink:#fff;--rare:#8a4ad0;--uni:#c9900a;--font:"Sunflower","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b16;--card:#2a251e;--ink:#efe6d2;--sub:#b3a68e;--line:#3d362b;--sage:#8fb06f;--sage-ink:#16130f;--rare:#b88aff;--uni:#f5c542;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1b16;--card:#2a251e;--ink:#efe6d2;--sub:#b3a68e;--line:#3d362b;--sage:#8fb06f;--sage-ink:#16130f;--rare:#b88aff;--uni:#f5c542;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
h1{font-size:26px;margin:0;text-wrap:balance}.lead{color:var(--sub);margin:4px 0 0;line-height:1.55}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:sticky;top:8px;z-index:2}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.grp>span{color:var(--sub);font-size:13px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
button[aria-pressed="true"]{background:var(--sage);color:var(--sage-ink);border-color:var(--sage)}button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;border-left:5px solid var(--ac)}
.head{display:flex;gap:10px;align-items:center}.head canvas{width:56px;height:40px;flex:none}
.head h2{margin:0;font-size:18px}.head small{color:var(--sub);font-size:13px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.sk{display:grid;gap:4px;min-width:0}.sk b{font-size:14px}.sk span{color:var(--sub);font-size:12px}
.sk canvas{image-rendering:pixelated;width:100%;height:auto;border-radius:8px;display:block}
[hidden]{display:none!important}
</style>
<div class="wrap">
  <header><h1>레어·유니크 전용 스킬 이펙트</h1>
  <p class="lead">캐릭터마다 설명에서 고른 상징(용 비늘·불사조 깃·삼지창·해파리·눈꽃·나비 등)을 스킬 모양별 연출에 얹었습니다. 같은 캐릭터 안에서 모양이 같은 스킬은 연출 변형이 갈리고, 캐릭터끼리는 상징이 달라 겹치지 않습니다. 레어 5색 이하, 유니크 6색 이하(전용 강조색) · 탑뷰 · 셀 카툰 · 색 외곽선 · 바닥 고리는 캐릭터 뒤.</p></header>
  <div class="bar">
    <div class="grp" id="grade"><span>등급</span><button data-v="0" aria-pressed="true">전체 (34명)</button><button data-v="4">유니크 (13명)</button><button data-v="3">레어 (21명)</button></div>
    <div class="grp" id="attr"><span>속성</span><button data-v="" aria-pressed="true">전체</button><button data-v="red">레드</button><button data-v="blue">블루</button><button data-v="green">그린</button></div>
    <div class="grp" id="zoom"><span>크기</span><button data-v="2" aria-pressed="true">크게</button><button data-v="1">작게</button></div>
    <button id="play" aria-pressed="true">⏸ 일시정지</button>
  </div>
  <div id="list" style="display:grid;gap:12px"></div>
</div>
<script>
const D = __DATA__;
const AC = { red: '#d8434a', blue: '#3a7fe0', green: '#3f9a3a' };
const SHAPE = { single: '단일', multi: '다수', circle: '원형', range: '사거리 전체', chain: '연쇄', 'buff-self': '자기 버프', 'buff-adjacent': '주변 아군 버프', 'buff-all': '아군 전체 버프', gold: '골드' };
const st = { grade: 0, attr: '', zoom: 2, playing: !matchMedia('(prefers-reduced-motion: reduce)').matches };
const SW = 128, SH = 112, BX = 64, BY = 62;
const byChar = {}; for (const e of D.fx) (byChar[e.id] ||= []).push(e);
const img = (s) => { const i = new Image(); i.src = s; return i; };
for (const e of D.fx) { e.i = img(e.src); if (e.backSrc) e.b = img(e.backSrc); }
const heroImg = {}; for (const [id, c] of Object.entries(D.chars)) heroImg[id] = img(c.char);
const stages = [];
const list = document.getElementById('list');
const order = Object.keys(byChar).sort((a, b) => byChar[b][0].grade - byChar[a][0].grade || byChar[a][0].attr.localeCompare(byChar[b][0].attr));
for (const id of order) {
  const fx = byChar[id], e0 = fx[0], c = D.chars[id];
  const card = document.createElement('section'); card.className = 'card'; card.style.setProperty('--ac', AC[e0.attr]);
  card.dataset.grade = e0.grade; card.dataset.attr = e0.attr;
  card.innerHTML = `<div class="head"><canvas width="56" height="40"></canvas><div><h2>${e0.name} <span class="tag" style="color:var(${e0.grade === 4 ? '--uni' : '--rare'})">${e0.grade === 4 ? '유니크' : '레어'}</span></h2><small>${c.title}</small></div></div><div class="skills"></div>`;
  list.appendChild(card);
  const hc = card.querySelector('.head canvas'); stages.push({ hero: true, id, cv: hc, f: 0, t: 0 });
  const box = card.querySelector('.skills');
  fx.forEach((e, k) => {
    const d = document.createElement('div'); d.className = 'sk';
    d.innerHTML = `<b>Lv${c.lv[k]} ${e.skill}</b><span>${SHAPE[e.shape] || e.shape}${e.variant ? ' · 변형 ' + (e.variant + 1) : ''} · ${e.colors}색</span><canvas></canvas>`;
    box.appendChild(d); stages.push({ e, id, cv: d.querySelector('canvas'), pos: 0, tm: -Math.random() * 500, gap: 0, f: 0, t: 0 });
  });
}
function tiles(g, z) {
  const T = 24, ox = ((BX - 12) % T) - T, oy = ((BY - 12) % T) - T;
  for (let ty = 0; oy + ty * T < SH; ty++) for (let tx = 0; ox + tx * T < SW; tx++) {
    const x = (ox + tx * T) * z, y = (oy + ty * T) * z; g.fillStyle = (tx + ty) % 2 ? '#696e7a' : '#adafb7'; g.fillRect(x, y, T * z, T * z);
    g.fillStyle = '#454953'; g.fillRect(x, y, T * z, z); g.fillRect(x, y, z, T * z);
  }
}
function draw(s) {
  if (s.hero) { const g = s.cv.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 56, 40); const h = heroImg[s.id]; if (h.complete) g.drawImage(h, s.f * 56, 0, 56, 40, 0, 0, 56, 40); return; }
  const z = st.zoom * 1, cv = s.cv, e = s.e;
  if (cv.width !== SW * z) { cv.width = SW * z; cv.height = SH * z; }
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false; tiles(g, z);
  const sheet = (im, x, y, sx = 1, ang = 0) => {
    if (!im || s.gap > 0 || !im.complete) return;
    g.save(); g.translate(x * z, y * z); g.rotate(ang); g.drawImage(im, s.pos * e.w, 0, e.w, e.h, -e.ax * z, -e.ay * z, e.w * z * sx, e.h * z); g.restore();
  };
  const hero = (x, y) => { const h = heroImg[s.id]; if (h.complete) g.drawImage(h, s.f * 56, 0, 56, 40, (x - 27) * z, (y - 23) * z, 56 * z, 40 * z); };
  if (e.kind === 'target') { for (const [x, y] of e.shape === 'multi' ? [[40, 46], [86, 56], [62, 84]] : [[64, 64]]) { sheet(e.b, x, y); sheet(e.i, x, y); } return; }
  if (e.kind === 'center') { sheet(e.b, BX, BY); sheet(e.i, BX, BY); return; }
  if (e.kind === 'chain') { hero(24, 84); let fx = 24, fy = 84; for (const [x, y] of [[60, 40], [100, 64], [110, 30]]) { const dx = x - fx, dy = y - fy; sheet(e.i, fx, fy, Math.hypot(dx, dy) / 64, Math.atan2(dy, dx)); fx = x; fy = y; } return; }
  if (e.kind === 'ally') { for (const x of [28, 64, 100]) { sheet(e.b, x, BY + 6); hero(x, BY); sheet(e.i, x, BY + 6); } return; }
  const y = e.kind === 'adj' || e.kind === 'self_area' ? BY : BY + 8;
  sheet(e.b, BX, y); hero(BX, BY); sheet(e.i, BX, y);
}
let last = performance.now();
(function loop(now) {
  const dt = now - last; last = now;
  for (const s of stages) {
    if (s.cv.closest('[hidden]')) continue;
    if (st.playing) {
      s.t += dt; while (s.t > 150) { s.t -= 150; s.f = (s.f + 1) % 8; }
      if (!s.hero) { if (s.gap > 0) s.gap -= dt; else { s.tm += dt; while (s.tm >= s.e.ms[s.pos]) { s.tm -= s.e.ms[s.pos]; s.pos++; if (s.pos >= s.e.n) { s.pos = 0; s.gap = 700; break; } } } }
    }
    draw(s);
  }
  requestAnimationFrame(loop);
})(performance.now());
function filt() { for (const c of list.children) c.hidden = (st.grade && +c.dataset.grade !== st.grade) || (st.attr && c.dataset.attr !== st.attr); }
function group(id, key, num) { const g = document.getElementById(id); g.addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); st[key] = num ? Number(b.dataset.v) : b.dataset.v; filt(); }); }
group('grade', 'grade', true); group('attr', 'attr', false); group('zoom', 'zoom', true);
const pb = document.getElementById('play'); const setP = (v) => { st.playing = v; pb.setAttribute('aria-pressed', v); pb.textContent = v ? '⏸ 일시정지' : '▶ 재생'; };
setP(st.playing); pb.onclick = () => setP(!st.playing);
</script>
