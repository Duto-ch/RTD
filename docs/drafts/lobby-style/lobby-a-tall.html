<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
  body { width: 544px; height: 960px; }

  .sp { flex: 1; } .round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; }
