<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css">
<style>
  body { width: 1280px; height: 720px; }
  .top { position: absolute; left: 20px; right: 20px; top: 14px; display: flex; align-items: center; gap: 10px; }
  .me { display: flex; align-items: center; gap: 10px; padding: 5px 18px 5px 5px; }
  .me .crest { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(#ffe88f, #f2b530); border: 2px solid #b47a12; display: grid; place-items: center; font-size: 24px; color: #6b4505; }
  .me b { font-size: 18px; display: block; line-height: 1.2; } .me small { font-size: 12px; color: var(--mint); }
  .sp { flex: 1; } .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; }
  .title { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); font-size: 30px; z-index: 2; white-space: nowrap; }
  .goal { position: absolute; left: 20px; top: 78px; padding: 10px 16px; width: 250px; }
  .goal h4 { font-size: 13px; color: #5a7f74; } .goal b { font-size: 16px; display: block; margin: 2px 0 6px; }
  .bar { height: 10px; border-radius: 5px; background: #e0d3a8; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(#58c096, #2b9a7c); border-radius: 5px; }
  .goal small { font-size: 12px; color: #5a7f74; display: flex; margin-top: 5px; } .goal small span { margin-left: auto; color: #7a52c8; font-weight: 700; }
  .hero { position: absolute; transform: translate(-50%, -100%); text-align: center; }
  .hero .sh { position: absolute; left: 50%; bottom: 20px; width: 70px; height: 20px; margin-left: -35px; border-radius: 50%; background: rgba(3, 26, 30, .35); }
  .hero img { position: relative; display: block; margin: 0 auto; }
  .hero .nm { position: relative; display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 2px 10px 2px 6px; font-size: 13px; font-weight: 700; border-radius: 99px; background: #fbf6e6; border: 2px solid #9aa7a4; box-shadow: 0 2px 0 rgba(3, 26, 30, .3); }
  .hero .nm .a { position: static; width: 11px; height: 11px; border-radius: 50%; border: 0; }
  .hero.g2 .nm { border-color: #4fb06a; } .hero.g3 .nm { border-color: #3f8fe0; } .hero.g4 .nm { border-color: #f2b530; background: #fff0b8; }
  .hero.g4 .halo { position: absolute; left: 50%; top: 40%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(rgba(255, 226, 122, .7), rgba(255, 226, 122, 0) 65%); }
  .nav { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: 860px; height: 74px; display: flex; align-items: center; justify-content: space-around; padding: 0 12px; border-radius: 26px; }
  .nav .it { width: 150px; text-align: center; font-size: 14px; font-weight: 700; color: var(--mint2); position: relative; }
  .nav .it i { font-size: 28px; display: block; margin: 0 auto 2px; color: #fff3c4; }
  .nav .it .dot { position: absolute; left: 86px; top: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); border: 2px solid #fff3dc; color: #fff; font-size: 11px; display: grid; place-items: center; }
  .nav .go { width: 170px; height: 96px; margin-top: -30px; border-radius: 30px; font-size: 30px; flex-direction: column; gap: 0; line-height: 1.05; }
  .nav .go small { font-size: 12px; font-weight: 400; opacity: .8; }
</style></head><body>
<div class="scene" id="s"></div>
<div class="top">
  <div class="me dk pill"><div class="crest"><i class="ic" data-i="shield"></i></div><div><b>두토 용병단</b><small>최고 기록 WAVE 32</small></div></div>
  <span class="sp"></span>
  <div class="cur dk pill"><span class="coin c-fame"><i class="ic" data-i="crown"></i></span>1,240<span class="plus">+</span></div>
  <div class="cur dk pill"><span class="coin c-tick"><i class="ic" data-i="ticket"></i></span>12<span class="plus">+</span></div>
  <div class="cur dk pill"><span class="coin c-gem"><i class="ic" data-i="gem"></i></span>86<span class="plus">+</span></div>
  <div class="round dk"><i class="ic" data-i="gear"></i></div>
</div>
<div class="goal lt"><h4>다음 목표</h4><b>WAVE 40 돌파</b><div class="bar"><i style="width:80%"></i></div><small>최고 32 / 40<span>보상 소환권 ×3</span></small></div>
<div id="heroes"></div>
<div class="nav dk">
  <div class="it"><i class="ic" data-i="node"></i>스킬 노드<span class="dot">3</span></div>
  <div class="it"><i class="ic" data-i="ticket"></i>용병 모집<span class="dot">1</span></div>
  <button class="btn gold go"><i class="ic" data-i="sword" style="font-size:30px"></i>출 전<small>WAVE 1부터</small></button>
  <div class="it"><i class="ic" data-i="people"></i>덱 편성</div>
  <div class="it"><i class="ic" data-i="anvil"></i>장비 강화<span class="dot">2</span></div>
</div>
<script src="scene.js"></script><script src="layouts.js"></script><script src="icons.js"></script><script src="common.js"></script>
<script>
  const L = JSON.parse(JSON.stringify(LAYOUT_CAMP)); L.items.push({ t: 'fire', x: 640, y: 568, s: 11 });
  document.getElementById('s').innerHTML = LobbyScene.scene(L);
  const NM = ['에릭', '핀', '아스트리드', '올라프', '토르발드', '로빈', '에드먼드', '이졸데'];
  const order = [0, 1, 2, 3, 7, 4, 5, 6]; // 유니크를 가운데로
  document.getElementById('heroes').innerHTML = order.map((di, i) => {
    const [k, g, a] = DECK[di]; const t = i / 7; const x = 230 + i * 117; const y = 560 - Math.sin(Math.PI * t) * 62; const sz = g === 4 ? 104 : 80;
    return `<div class="hero g${g}" style="left:${x}px;top:${y}px">${g === 4 ? '<span class="halo"></span>' : ''}<span class="sh"></span><img class="px" src="spr/${k}.png" width="${sz}" height="${sz}"><span class="nm"><span class="a ${a}"></span>${NM[di]}</span></div>`;
  }).join('');
  icons();
</script></body></html>
